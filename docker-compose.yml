# ============================================================================
# Ledger Service — Docker Compose
# ============================================================================
# Provides:
#   - PostgreSQL 16 with persistent volume and health checks
#   - Ledger application service (uncomment when ready)
#
# Usage:
#   docker compose up -d postgres    # Start database only
#   docker compose up -d             # Start everything
#   docker compose down              # Stop services
#   docker compose down -v           # Stop and remove volumes
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-bookworm
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Ledger Application (uncomment after Phase 2)
  # --------------------------------------------------------------------------
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ledger-app
  #   environment:
  #     DATABASE_URL: postgres://postgres:postgres@postgres:5432/ledger
  #     SERVER_HOST: 0.0.0.0
  #     SERVER_PORT: 8080
  #     DATABASE_MAX_CONNECTIONS: 10
  #     DATABASE_MIN_CONNECTIONS: 2
  #     DATABASE_ACQUIRE_TIMEOUT_SECONDS: 5
  #     RUST_LOG: info
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
